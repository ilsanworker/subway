<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Subway | 실시간 열차</title>

<style>
:root {
  --bg: #0f172a;
  --panel: #111827;
  --text: #111827;
  --muted: #64748b;
  --border: #e2e8f0;
  --line-color: #009D3E;
  --train-up: #ef4444;
  --train-down: #3b82f6;
  --accent: #0071e3;
  --v-spacing: 110px;
  --h-spacing: 120px;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               Roboto, sans-serif;
}

body {
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
}

button,
input,
select {
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

.app-container {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* ========================================
   상단 노선 선택 바
======================================== */

.line-selector {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  overflow-x: auto;
  overflow-y: hidden;
  background: var(--bg);
  border-bottom: 1px solid #263449;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  z-index: 20;
}

.line-selector::-webkit-scrollbar {
  display: none;
}

.line-button {
  flex: 0 0 auto;
  height: 30px;
  min-width: 20px;
  padding: 0 12px;
  border: 1px solid #334155;
  border-radius: 20px;
  background: #1e293b;
  color: #cbd5e1;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
  transition: background .2s, color .2s, border-color .2s;
}

.line-button.active {
  background: var(--line-color);
  color: white;
  border-color: var(--line-color);
}

/* ========================================
   메인 세로 지도
======================================== */

.main-content {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
  padding: 10px 0 100px;
  background: var(--bg);
  scrollbar-width: thin;
}

.map-instruction {
  margin-bottom: 25px;
  padding: 0 12px;
  text-align: center;
  color: #94a3b8;
  font-size: 12px;
}

.vertical-map-container {
  position: relative;
  width: min(320px, 96vw);
  margin: 0 auto;
}

.v-track-line {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 4px;
  background: #334155;
  border-radius: 2px;
}

.v-up-line {
  left: 28px;
}

.v-down-line {
  right: 28px;
}

.v-station-nodes {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
}

.v-station-node {
  position: absolute;
  left: 50%;
  width: 14px;
  height: 14px;
  background: #1e293b;
  border: 3px solid var(--line-color);
  border-radius: 50%;
  cursor: pointer;
  transform: translateX(-50%);
  z-index: 5;
}

.v-station-node:hover {
  background: white;
  transform: translateX(-50%) scale(1.3);
}

.v-station-name {
  position: absolute;
  left: 50%;
  top: -20px;
  transform: translateX(-50%);
  color: #f8fafc;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  text-shadow: 0 1px 3px #000;
}

.v-trains-container {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 6;
}

.v-train {
  position: absolute;
  width: 44px;
  padding: 4px 0;
  border-radius: 6px;
  color: white;
  font-size: 11px;
  font-weight: bold;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transform: translateX(-50%);
  box-shadow: 0 0 8px #0008;
  transition: top 1s cubic-bezier(.25, 1, .5, 1);
}

.v-train.up {
  left: 28px;
  background: var(--train-up);
}

.v-train.down {
  left: calc(100% - 28px);
  background: var(--train-down);
}

.v-train-status {
  margin-top: 2px;
  font-size: 10px;
  white-space: nowrap;
}

/* ========================================
   오른쪽 하단 새로고침 버튼
======================================== */

.refresh-widget {
  position: fixed;
  right: 18px;
  bottom: 20px;
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}

.refresh-button {
  width: 54px;
  height: 54px;
  border: none;
  border-radius: 50%;
  background: #ffffff;
  color: #111827;
  font-size: 24px;
  box-shadow: 0 4px 18px #0004;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .2s, opacity .2s;
}

.refresh-button:active {
  transform: rotate(45deg) scale(.94);
}

.refresh-button.loading {
  opacity: .7;
  animation: spin 1s linear infinite;
}

.last-refresh {
  padding: 4px 7px;
  border-radius: 10px;
  background: #ffffff;
  color: #475569;
  font-size: 10px;
  font-weight: 600;
  white-space: nowrap;
  box-shadow: 0 2px 8px #0002;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* ========================================
   상세 팝업
======================================== */

.full-popup {
  position: absolute;
  inset: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  background: #ffffff;
}

.full-popup.hidden {
  display: none;
}

.popup-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  background: white;
  border-bottom: 1px solid var(--border);
}

.popup-stn-name {
  margin-left: 6px;
  font-size: 18px;
  font-weight: 700;
}

.badge {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 6px;
  background: var(--line-color);
  color: white;
  font-size: 12px;
  font-weight: 700;
}

.close-btn {
  flex-shrink: 0;
  padding: 7px 12px;
  border: none;
  border-radius: 8px;
  background: #e2e8f0;
  font-weight: bold;
  cursor: pointer;
}

/* ========================================
   팝업 가로 지도
======================================== */

.h-map-area {
  height: 140px;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  background: var(--bg);
  border-bottom: 2px solid var(--line-color);
}

.h-track-scroll-container {
  height: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  display: flex;
  align-items: center;
  padding: 0 40px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.h-track-scroll-container::-webkit-scrollbar {
  display: none;
}

.h-track-wrapper {
  height: 100%;
  position: relative;
  flex-shrink: 0;
}

.h-track-line {
  position: absolute;
  left: 0;
  right: 0;
  height: 3px;
  background: #334155;
  border-radius: 2px;
}

.h-track-line.h-up-line {
  top: 40px;
}

.h-track-line.h-down-line {
  top: 100px;
}

.h-station-nodes {
  position: absolute;
  inset: 0 auto 0 0;
  height: 100%;
  z-index: 2;
}

.h-station-node {
  position: absolute;
  top: 63px;
  width: 14px;
  height: 14px;
  background: #1e293b;
  border: 2px solid var(--line-color);
  border-radius: 50%;
  transform: translateX(-50%);
}

.h-station-name {
  position: absolute;
  top: -24px;
  left: 50%;
  transform: translateX(-50%);
  color: #cbd5e1;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}

.h-trains-container {
  position: absolute;
  inset: 0;
  height: 100%;
  pointer-events: none;
  z-index: 3;
}

.h-train {
  position: absolute;
  width: 44px;
  padding: 4px 0;
  border-radius: 6px;
  color: white;
  font-size: 10px;
  font-weight: bold;
  display: flex;
  flex-direction: column;
  align-items: center;
  transform: translateX(-50%);
  box-shadow: 0 0 8px #0008;
  transition: left 1s cubic-bezier(.25, 1, .5, 1);
}

.h-train.up {
  top: 20px;
  background: var(--train-up);
}

.h-train.down {
  top: 80px;
  background: var(--train-down);
}

.h-train-status {
  margin-top: 2px;
  font-size: 9px;
  white-space: nowrap;
}

/* ========================================
   팝업 데이터 영역
======================================== */

.popup-body {
  flex: 1;
  min-height: 0;
  padding: 14px;
  overflow-y: auto;
  background: #f8f9fa;
  overscroll-behavior: contain;
}

.info-section {
  margin-bottom: 16px;
  padding: 14px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 2px 8px #00000008;
}

.info-section h3 {
  margin: 0 0 12px;
  font-size: 14px;
}

.arrival-split {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.arr-col {
  flex: 1;
  min-width: 0;
  padding: 8px;
  background: #f8fafc;
  border: 1px solid var(--border);
  border-radius: 8px;
}

.arr-col h4 {
  margin: 0 0 10px;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}

.arr-item,
.tt-item {
  margin-bottom: 6px;
  padding: 8px;
  background: white;
  border: 1px solid var(--border);
  border-left: 4px solid #ccc;
  border-radius: 6px;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.arr-item.up,
.tt-item.up {
  border-left-color: var(--train-up);
}

.arr-item.down,
.tt-item.down {
  border-left-color: var(--train-down);
}

.arr-top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 4px;
  margin-bottom: 4px;
}

.arr-time {
  color: #dc2626;
  font-size: 12px;
  font-weight: 700;
}

.arr-desc {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.exp-badge {
  flex-shrink: 0;
  padding: 2px 4px;
  border-radius: 4px;
  background: #64748b;
  color: white;
  font-size: 9px;
  font-weight: bold;
}

.exp-express {
  background: #eab308;
  color: #111;
}

.exp-special {
  background: #ef4444;
  color: white;
}

.loading-text {
  margin-bottom: 10px;
  color: var(--muted);
  font-size: 12px;
  font-style: italic;
}

.loading-text.hidden {
  display: none;
}

.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.stat-box {
  padding: 12px;
  background: #f8fafc;
  border: 1px solid var(--border);
  border-radius: 8px;
}

.stat-title {
  margin-bottom: 4px;
  color: var(--muted);
  font-size: 11px;
}

.stat-value {
  font-size: 16px;
  font-weight: 700;
  overflow-wrap: anywhere;
}

.tt-list {
  max-height: 250px;
  overflow-y: auto;
}


.line-button { border-color:#334155; background:#1e293b; color:#cbd5e1; }
.main-content { background:var(--bg); }
.train-detail-card { position:fixed;left:10px;right:10px;bottom:10px;z-index:80;padding:12px;border:1px solid #334155;border-radius:18px;background:rgba(15,23,42,.97);color:#f8fafc;box-shadow:0 16px 45px #0008;backdrop-filter:blur(16px); }
.train-detail-card.hidden { display:none; }
.train-card-top { display:flex;align-items:center;gap:10px; }
.train-line-circle { width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;border-radius:50%;background:var(--line-color);color:white;font-weight:800; }
.train-card-heading { flex:1;min-width:0; }
.train-card-title { font-size:13px;font-weight:700; }
.train-card-title strong { font-size:15px; }
.train-status-pill { display:inline-block;margin-left:4px;padding:3px 7px;border-radius:8px;background:#7f1d1d;color:#fecaca;font-size:9px; }
.train-card-sub { margin-top:4px;color:#cbd5e1;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.train-card-refresh { width:34px;height:34px;border:1px solid #334155;border-radius:50%;background:#1e293b;color:#e2e8f0;font-size:18px; }
.train-card-progress-label { display:flex;justify-content:space-between;margin-top:12px;margin-bottom:6px;font-size:10px;color:#cbd5e1; }
.train-card-progress-label strong { color:#fbbf24; }
.train-progress { height:7px;overflow:hidden;border-radius:4px;background:repeating-linear-gradient(90deg,#fbbf24 0 18px,#334155 18px 21px); }
.train-progress span { display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#f59e0b,#34d399);transition:width .25s; }
.train-progress-scale { display:flex;justify-content:space-between;margin-top:5px;color:#94a3b8;font-size:9px; }
.train-card-actions { display:flex;gap:8px;margin-top:12px; }
.train-card-actions button { flex:1;min-width:0;border:0;border-radius:10px;padding:10px 6px;background:#1e293b;color:#e2e8f0;font-size:11px;font-weight:700; }
.train-card-actions button:last-child { background:#10b981;color:#052e25; }
.v-train { pointer-events:auto;cursor:pointer;z-index:8; }
@media (min-width:700px) { .train-detail-card { left:auto;right:22px;bottom:22px;width:360px; } }

@media (max-width: 360px) {
  .line-selector {
    padding: 10px;
    gap: 6px;
  }

  .line-button {
    padding: 0 10px;
    font-size: 11px;
  }

  .popup-body {
    padding: 8px;
  }

  .info-section {
    padding: 10px;
  }

  .arrival-split {
    gap: 6px;
  }

  .arr-col {
    padding: 5px;
  }
}


/* ========================================
   성빈 스타일 리메이크: 미니멀 라이트 UI
   흰색·차콜·노선 고유색만 사용하고 장식은 최소화
======================================== */
:root {
  --bg: #f5f5f7;
  --panel: #ffffff;
  --text: #171717;
  --muted: #737780;
  --border: #e5e5e8;
  --line-color: #009D3E;
  --train-up: #e34f4f;
  --train-down: #3478f6;
  --accent: #171717;
  --v-spacing: 96px;
  --h-spacing: 116px;
}

html, body { background: var(--bg); color: var(--text); }
body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
.app-container { background: var(--bg); }

.line-selector {
  gap: 7px;
  padding: 12px 14px 10px;
  background: var(--bg);
  border-bottom: 1px solid #e8e8eb;
  box-shadow: none;
}
.line-button {
  height: 32px;
  min-width: 42px;
  padding: 0 13px;
  border: 1px solid #e3e3e7;
  border-radius: 999px;
  background: transparent;
  color: #62656d;
  font-size: 12px;
  font-weight: 650;
  letter-spacing: -.2px;
  transition: background .16s ease, color .16s ease, border-color .16s ease, transform .16s ease;
}
.line-button:active { transform: scale(.96); }
.line-button.active {
  color: #fff !important;
  border-color: var(--line-color) !important;
  background: var(--line-color) !important;
  box-shadow: none;
}

.main-content {
  padding: 14px 0 110px;
  background: var(--bg);
  scrollbar-width: none;
  overscroll-behavior-y: contain;
}
.main-content::-webkit-scrollbar { display: none; }
.map-instruction {
  margin: 0 0 24px;
  padding: 0 18px;
  color: #8a8d94;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: -.1px;
}
.vertical-map-container { width: 250px; }
.v-track-line {
  width: 3px;
  background: #d6d8dd;
  border-radius: 10px;
}
.v-up-line { left: 26px; }
.v-down-line { right: 26px; }
.v-station-node {
  width: 13px;
  height: 13px;
  background: #fff;
  border: 3px solid var(--line-color);
  box-shadow: 0 0 0 3px var(--bg);
}
.v-station-node:hover { background: var(--line-color); }
.v-station-name {
  top: -19px;
  color: #292b30;
  font-size: 12px;
  font-weight: 650;
  text-shadow: none;
  letter-spacing: -.25px;
}
.v-train {
  width: 48px;
  padding: 6px 3px 5px;
  border: 2px solid #fff;
  border-radius: 10px;
  box-shadow: 0 2px 8px #11111118;
  font-size: 10px;
  line-height: 1.1;
  transition: top .8s cubic-bezier(.2,.7,.2,1), transform .16s ease;
}
.v-train:active { transform: translateX(-50%) scale(.94); }
.v-train.up { left: 28px; background: var(--train-up); }
.v-train.down { left: 222px; background: var(--train-down); }
.v-train-status { font-size: 9px; font-weight: 600; opacity: .95; }

.refresh-widget { right: 16px; bottom: 18px; gap: 5px; }
.refresh-button {
  width: 46px;
  height: 46px;
  background: #171717;
  color: #fff;
  border: 1px solid #171717;
  box-shadow: 0 5px 16px #11111120;
  font-size: 22px;
}
.last-refresh {
  background: #fff;
  color: #777a82;
  border: 1px solid #ececf0;
  box-shadow: 0 2px 7px #11111108;
}

/* 열차 선택 카드: 앱 위에 얹힌 작은 상태 패널 */
.train-detail-card {
  left: 12px;
  right: 12px;
  bottom: 12px;
  padding: 15px 15px 13px;
  border: 1px solid #e6e6e9;
  border-radius: 20px;
  background: rgba(255,255,255,.97);
  color: #171717;
  box-shadow: 0 12px 40px #17171718;
  backdrop-filter: blur(20px);
}
.train-card-top { gap: 11px; }
.train-line-circle {
  width: 34px;
  height: 34px;
  flex-basis: 34px;
  border-radius: 12px;
  font-size: 14px;
  box-shadow: none;
}
.train-card-title { color: #737780; font-size: 11px; font-weight: 600; }
.train-card-title strong { color: #171717; font-size: 16px; letter-spacing: -.35px; }
.train-status-pill {
  margin-left: 5px;
  padding: 4px 7px;
  border-radius: 999px;
  background: #fbe9e9;
  color: #c63838;
  font-size: 9px;
  font-weight: 700;
}
.train-card-sub { margin-top: 4px; color: #777a82; font-size: 11px; }
.train-card-refresh {
  width: 32px;
  height: 32px;
  border: 1px solid #e8e8eb;
  border-radius: 50%;
  background: #f7f7f8;
  color: #25262a;
  font-size: 17px;
}
.train-card-progress-label { margin-top: 15px; margin-bottom: 7px; color: #777a82; font-size: 10px; }
.train-card-progress-label strong { color: #171717; font-size: 11px; }
.train-progress { height: 6px; border-radius: 99px; background: #e9eaed; }
.train-progress span { border-radius: 99px; background: var(--line-color); }
.train-progress-scale { margin-top: 6px; color: #858891; font-size: 9px; }
.train-card-actions { gap: 8px; margin-top: 13px; }
.train-card-actions button {
  min-height: 38px;
  padding: 10px 8px;
  border: 1px solid #e7e7ea;
  border-radius: 11px;
  background: #f5f5f7;
  color: #24252a;
  font-size: 11px;
  font-weight: 650;
  transition: transform .15s ease, background .15s ease;
}
.train-card-actions button:active { transform: scale(.98); }
.train-card-actions button:last-child { background: #171717; border-color: #171717; color: #fff; }

/* 역 상세 화면 */
.full-popup { background: #f5f5f7; }
.popup-header {
  padding: 16px 17px;
  background: rgba(255,255,255,.96);
  border-bottom: 1px solid #e8e8eb;
}
.popup-stn-name { margin-left: 8px; color: #171717; font-size: 18px; letter-spacing: -.5px; }
.badge { padding: 5px 9px; border-radius: 8px; font-size: 11px; }
.close-btn {
  padding: 8px 11px;
  border: 1px solid #e7e7ea;
  border-radius: 10px;
  background: #f5f5f7;
  color: #27282c;
  font-size: 12px;
}
.h-map-area { height: 132px; background: #f0f1f3; border-bottom: 1px solid #e3e4e8; }
.h-track-line { height: 3px; background: #d0d3d8; }
.h-station-node { background: #fff; box-shadow: 0 0 0 3px #f0f1f3; }

.v-station-node:hover { transform: translateX(-50%) scale(1.18); box-shadow: 0 0 0 7px color-mix(in srgb, var(--line-color) 13%, transparent), 0 5px 16px #0002; }
.v-station-name { top: -24px; color: #17181c; font-size: 15px; text-shadow: none; letter-spacing: -.25px; }
.v-station-node.is-transfer { border-color: var(--line-color); box-shadow: 0 0 0 4px #fff, 0 0 0 7px color-mix(in srgb, var(--line-color) 18%, transparent), 0 4px 12px #00000012; }

.v-station-tags { display:flex; gap:3px; align-items:center; flex-wrap:wrap; }

.v-transfer-tag { color:var(--line-color); border-color:color-mix(in srgb, var(--line-color) 30%, white); }
.v-transfer-tag:active, .v-rail-tag:active { transform:scale(.94); }
.v-rail-tag.ktx { color:#7c3aed; background:#f5f0ff; border-color:#e9d5ff; }
.v-rail-tag.rail { color:#0369a1; background:#eff8ff; border-color:#bae6fd; }
.v-train { width:52px; padding:6px 2px; border-radius:10px; font-size:12px; box-shadow:0 5px 15px #00000020; transition:top .85s cubic-bezier(.22,1,.36,1), transform .3s ease, box-shadow .3s ease; }
.v-train-status { font-size:10px; }
.h-map-area { height:160px; }
.h-track-scroll-container { scroll-behavior:smooth; }
.h-station-node { width:17px; height:17px; }
.h-station-name { font-size:12px; }
.h-train { width:52px; padding:6px 2px; border-radius:10px; font-size:11px; box-shadow:0 5px 15px #00000020; }
.popup-header { padding:14px 18px; }
.popup-stn-name { font-size:21px; }
.badge { padding:6px 10px; font-size:13px; }
.info-section { border-radius:20px; }
.arr-col h4 { font-size:13px; }
.arr-item, .tt-item { padding:14px; }
.refresh-button { width:58px; height:58px; }
@media(max-width:600px) {
  :root { --v-spacing: 114px; }
  .v-station-name { font-size:14px; }
  .v-station-meta { left: calc(50% + 17px); max-width:105px; }
  .v-transfer-tag, .v-rail-tag { font-size:8px; padding:3px 4px; }
  .v-train { width:48px; }
  .h-map-area { height:150px; }
}
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition-duration:.01ms!important; animation-duration:.01ms!important; } }
</style>

.v-station-meta { pointer-events:auto; }
