<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Seoul Subway Radar</title>

<style>
:root {
  --bg: #0f172a;
  --panel: #ffffff;
  --text: #111827;
  --muted: #64748b;
  --border: #e2e8f0;
  --line-color: #009D3E;
  --train-up: #ef4444;
  --train-down: #3b82f6;
  --accent: #0071e3;
  --v-spacing: 110px;
  --h-spacing: 120px;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               Roboto, sans-serif;
}

body {
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
}

button,
input,
select {
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

.app-container {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* ========================================
   상단 노선 선택 바
======================================== */

.line-selector {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 14px;
  overflow-x: auto;
  overflow-y: hidden;
  background: #ffffff;
  border-bottom: 1px solid var(--border);
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  z-index: 20;
}

.line-selector::-webkit-scrollbar {
  display: none;
}

.line-button {
  flex: 0 0 auto;
  height: 30px;
  min-width: 20px;
  padding: 0 12px;
  border: 1px solid #e2e8f0;
  border-radius: 20px;
  background: #f8fafc;
  color: #475569;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
  transition: background .2s, color .2s, border-color .2s;
}

.line-button.active {
  background: var(--line-color);
  color: white;
  border-color: var(--line-color);
}

/* ========================================
   메인 세로 지도
======================================== */

.main-content {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
  padding: 20px 0 100px;
  background: var(--bg);
  scrollbar-width: thin;
}

.map-instruction {
  margin-bottom: 25px;
  padding: 0 12px;
  text-align: center;
  color: #94a3b8;
  font-size: 12px;
}

.vertical-map-container {
  position: relative;
  width: 220px;
  margin: 0 auto;
}

.v-track-line {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 4px;
  background: #334155;
  border-radius: 2px;
}

.v-up-line {
  left: 20px;
}

.v-down-line {
  right: 20px;
}

.v-station-nodes {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
}

.v-station-node {
  position: absolute;
  left: 50%;
  width: 14px;
  height: 14px;
  background: #1e293b;
  border: 3px solid var(--line-color);
  border-radius: 50%;
  cursor: pointer;
  transform: translateX(-50%);
  z-index: 5;
}

.v-station-node:hover {
  background: white;
  transform: translateX(-50%) scale(1.3);
}

.v-station-name {
  position: absolute;
  left: 50%;
  top: -20px;
  transform: translateX(-50%);
  color: #f8fafc;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  text-shadow: 0 1px 3px #000;
}

.v-trains-container {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 6;
}

.v-train {
  position: absolute;
  width: 44px;
  padding: 4px 0;
  border-radius: 6px;
  color: white;
  font-size: 11px;
  font-weight: bold;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transform: translateX(-50%);
  box-shadow: 0 0 8px #0008;
  transition: top 1s cubic-bezier(.25, 1, .5, 1);
}

.v-train.up {
  left: 22px;
  background: var(--train-up);
}

.v-train.down {
  left: 202px;
  background: var(--train-down);
}

.v-train-status {
  margin-top: 2px;
  font-size: 10px;
  white-space: nowrap;
}

/* ========================================
   오른쪽 하단 새로고침 버튼
======================================== */

.refresh-widget {
  position: fixed;
  right: 18px;
  bottom: 20px;
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}

.refresh-button {
  width: 54px;
  height: 54px;
  border: none;
  border-radius: 50%;
  background: #ffffff;
  color: #111827;
  font-size: 24px;
  box-shadow: 0 4px 18px #0004;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .2s, opacity .2s;
}

.refresh-button:active {
  transform: rotate(45deg) scale(.94);
}

.refresh-button.loading {
  opacity: .7;
  animation: spin 1s linear infinite;
}

.last-refresh {
  padding: 4px 7px;
  border-radius: 10px;
  background: #ffffff;
  color: #475569;
  font-size: 10px;
  font-weight: 600;
  white-space: nowrap;
  box-shadow: 0 2px 8px #0002;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* ========================================
   상세 팝업
======================================== */

.full-popup {
  position: absolute;
  inset: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  background: #ffffff;
}

.full-popup.hidden {
  display: none;
}

.popup-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  background: white;
  border-bottom: 1px solid var(--border);
}

.popup-stn-name {
  margin-left: 6px;
  font-size: 18px;
  font-weight: 700;
}

.badge {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 6px;
  background: var(--line-color);
  color: white;
  font-size: 12px;
  font-weight: 700;
}

.close-btn {
  flex-shrink: 0;
  padding: 7px 12px;
  border: none;
  border-radius: 8px;
  background: #e2e8f0;
  font-weight: bold;
  cursor: pointer;
}

/* ========================================
   팝업 가로 지도
======================================== */

.h-map-area {
  height: 140px;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  background: var(--bg);
  border-bottom: 2px solid var(--line-color);
}

.h-track-scroll-container {
  height: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  display: flex;
  align-items: center;
  padding: 0 40px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.h-track-scroll-container::-webkit-scrollbar {
  display: none;
}

.h-track-wrapper {
  height: 100%;
  position: relative;
  flex-shrink: 0;
}

.h-track-line {
  position: absolute;
  left: 0;
  right: 0;
  height: 3px;
  background: #334155;
  border-radius: 2px;
}

.h-track-line.h-up-line {
  top: 40px;
}

.h-track-line.h-down-line {
  top: 100px;
}

.h-station-nodes {
  position: absolute;
  inset: 0 auto 0 0;
  height: 100%;
  z-index: 2;
}

.h-station-node {
  position: absolute;
  top: 63px;
  width: 14px;
  height: 14px;
  background: #1e293b;
  border: 2px solid var(--line-color);
  border-radius: 50%;
  transform: translateX(-50%);
}

.h-station-name {
  position: absolute;
  top: -24px;
  left: 50%;
  transform: translateX(-50%);
  color: #cbd5e1;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}

.h-trains-container {
  position: absolute;
  inset: 0;
  height: 100%;
  pointer-events: none;
  z-index: 3;
}

.h-train {
  position: absolute;
  width: 44px;
  padding: 4px 0;
  border-radius: 6px;
  color: white;
  font-size: 10px;
  font-weight: bold;
  display: flex;
  flex-direction: column;
  align-items: center;
  transform: translateX(-50%);
  box-shadow: 0 0 8px #0008;
  transition: left 1s cubic-bezier(.25, 1, .5, 1);
}

.h-train.up {
  top: 20px;
  background: var(--train-up);
}

.h-train.down {
  top: 80px;
  background: var(--train-down);
}

.h-train-status {
  margin-top: 2px;
  font-size: 9px;
  white-space: nowrap;
}

/* ========================================
   팝업 데이터 영역
======================================== */

.popup-body {
  flex: 1;
  min-height: 0;
  padding: 14px;
  overflow-y: auto;
  background: #f8f9fa;
  overscroll-behavior: contain;
}

.info-section {
  margin-bottom: 16px;
  padding: 14px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 2px 8px #00000008;
}

.info-section h3 {
  margin: 0 0 12px;
  font-size: 14px;
}

.arrival-split {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.arr-col {
  flex: 1;
  min-width: 0;
  padding: 8px;
  background: #f8fafc;
  border: 1px solid var(--border);
  border-radius: 8px;
}

.arr-col h4 {
  margin: 0 0 10px;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}

.arr-item,
.tt-item {
  margin-bottom: 6px;
  padding: 8px;
  background: white;
  border: 1px solid var(--border);
  border-left: 4px solid #ccc;
  border-radius: 6px;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.arr-item.up,
.tt-item.up {
  border-left-color: var(--train-up);
}

.arr-item.down,
.tt-item.down {
  border-left-color: var(--train-down);
}

.arr-top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 4px;
  margin-bottom: 4px;
}

.arr-time {
  color: #dc2626;
  font-size: 12px;
  font-weight: 700;
}

.arr-desc {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.exp-badge {
  flex-shrink: 0;
  padding: 2px 4px;
  border-radius: 4px;
  background: #64748b;
  color: white;
  font-size: 9px;
  font-weight: bold;
}

.exp-express {
  background: #eab308;
  color: #111;
}

.exp-special {
  background: #ef4444;
  color: white;
}

.loading-text {
  margin-bottom: 10px;
  color: var(--muted);
  font-size: 12px;
  font-style: italic;
}

.loading-text.hidden {
  display: none;
}

.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.stat-box {
  padding: 12px;
  background: #f8fafc;
  border: 1px solid var(--border);
  border-radius: 8px;
}

.stat-title {
  margin-bottom: 4px;
  color: var(--muted);
  font-size: 11px;
}

.stat-value {
  font-size: 16px;
  font-weight: 700;
  overflow-wrap: anywhere;
}

.tt-list {
  max-height: 250px;
  overflow-y: auto;
}

@media (max-width: 360px) {
  .line-selector {
    padding: 10px;
    gap: 6px;
  }

  .line-button {
    padding: 0 10px;
    font-size: 11px;
  }

  .popup-body {
    padding: 8px;
  }

  .info-section {
    padding: 10px;
  }

  .arrival-split {
    gap: 6px;
  }

  .arr-col {
    padding: 5px;
  }
}
</style>
</head>

<body>
<div class="app-container">

  <!-- 헤더 대신 가로형 노선 선택 -->
  <nav class="line-selector" id="lineSelector"
       aria-label="지하철 노선 선택"></nav>

  <!-- 세로형 노선 지도 -->
  <main class="main-content" id="mainContent">
    <div class="map-instruction">
      역을 터치하면 실시간 열차 및 상세 정보가 표시됩니다.
    </div>

    <div class="vertical-map-container" id="vMapContainer">
      <div class="v-track-line v-up-line"></div>
      <div class="v-track-line v-down-line"></div>
      <div id="vStationNodes" class="v-station-nodes"></div>
      <div id="vTrainsContainer" class="v-trains-container"></div>
    </div>
  </main>

  <!-- 오른쪽 하단 새로고침 -->
  <div class="refresh-widget">
    <button class="refresh-button" id="refreshButton"
            aria-label="실시간 열차 정보 새로고침"
            title="새로고침">↻</button>
    <span class="last-refresh" id="lastRefresh">새로고침 대기 중</span>
  </div>

  <!-- 역 상세 팝업 -->
  <div class="full-popup hidden" id="fullPopup">

    <div class="popup-header">
      <div>
        <span class="badge" id="panelLineBadge">2호선</span>
        <span id="panelStationName" class="popup-stn-name">강남역</span>
      </div>
      <button class="close-btn" id="closePopup">✕ 닫기</button>
    </div>

    <section class="h-map-area">
      <div class="h-track-scroll-container" id="hTrackScroll">
        <div class="h-track-wrapper" id="hTrackWrapper">
          <div class="h-track-line h-up-line"></div>
          <div class="h-track-line h-down-line"></div>
          <div id="hStationNodes" class="h-station-nodes"></div>
          <div id="hTrainsContainer" class="h-trains-container"></div>
        </div>
      </div>
    </section>

    <div class="popup-body">

      <section class="info-section">
        <h3>⏱️ 실시간 도착 정보</h3>
        <div id="arrLoading" class="loading-text">불러오는 중...</div>
        <div class="arrival-split">
          <div class="arr-col">
            <h4>상행 / 내선</h4>
            <div id="arrUpList">도착 정보 없음</div>
          </div>
          <div class="arr-col">
            <h4>하행 / 외선</h4>
            <div id="arrDownList">도착 정보 없음</div>
          </div>
        </div>
      </section>

      <section class="info-section">
        <h3>📊 승하차 통계</h3>
        <div id="statLoading" class="loading-text">데이터 분석 중...</div>
        <div class="stat-grid">
          <div class="stat-box">
            <div class="stat-title">조회 날짜 승차</div>
            <div class="stat-value" id="timeRideNum">-</div>
          </div>
          <div class="stat-box">
            <div class="stat-title">조회 날짜 하차</div>
            <div class="stat-value" id="timeAlightNum">-</div>
          </div>
        </div>
      </section>

      <section class="info-section">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px">
          <h3 style="margin:0">🕒 역 시간표</h3>
          <span id="ttDateType"
                style="font-size:12px;font-weight:bold;color:var(--accent)">
            평일 기준
          </span>
        </div>

        <p style="font-size:11px;color:#64748b">
          현재 시간 이후의 열차를 표시합니다.
        </p>

        <div id="ttLoading" class="loading-text">
          시간표 데이터를 불러오는 중입니다...
        </div>

        <div class="arrival-split">
          <div class="arr-col">
            <h4>상행 / 내선</h4>
            <div id="ttUpList" class="tt-list">시간표 없음</div>
          </div>
          <div class="arr-col">
            <h4>하행 / 외선</h4>
            <div id="ttDownList" class="tt-list">시간표 없음</div>
          </div>
        </div>
      </section>

    </div>
  </div>

</div>

<script>
/* ========================================
   API 설정

   실제 서비스에서는 API 키를 서버에서 관리하세요.
======================================== */

const REALTIME_API_KEY = '여기에_새로운_서울시_API_키';
const OPEN_API_KEY = '여기에_새로운_공공데이터_API_키';

  location.hostname === 'localhost' ||
  location.hostname === '127.0.0.1' ||
  location.hostname === '';

const BASE_SW = IS_LOCAL
  ? 'http://swopenapi.seoul.go.kr/api/subway'
  : '/api/sw';

  : '/api/open';

/* ========================================
   앱 상태
======================================== */

let currentLine = '2호선';
let currentStation = '';
let currentPopupStations = [];

let refreshInterval = null;
let popupRefreshTimer = null;
let elapsedTimer = null;

let mapRequestId = 0;
let popupRequestId = 0;
let lastRefreshTime = null;
let isRefreshing = false;


/* ========================================
   DOM
======================================== */

const $ = id => document.getElementById(id);

const lineSelector = $('lineSelector');
const fullPopup = $('fullPopup');
const closePopupBtn = $('closePopup');
const refreshButton = $('refreshButton');

const vMapContainer = $('vMapContainer');
const vStationNodes = $('vStationNodes');
const vTrainsContainer = $('vTrainsContainer');

const hTrackWrapper = $('hTrackWrapper');
const hStationNodes = $('hStationNodes');
const hTrainsContainer = $('hTrainsContainer');

const pName = $('panelStationName');
const pBadge = $('panelLineBadge');

const arrUpList = $('arrUpList');
const arrDownList = $('arrDownList');
const ttUpList = $('ttUpList');
const ttDownList = $('ttDownList');

const timeRideNum = $('timeRideNum');
const timeAlightNum = $('timeAlightNum');

const ttDateType = $('ttDateType');

const V_SPACING = 110;
const H_SPACING = 120;


/* ========================================
   유틸리티
======================================== */

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  })[char]);
}

function normalizeStationName(name) {
  return String(name || '')
    .trim()
    .replace(/\s+/g, '')
    .replace(/역$/, '')
    .replace(/\([^)]*\)/g, '');
}

function getStationIndex(stations, name) {
  const target = normalizeStationName(name);

  if (!target) return -1;

  return stations.findIndex(station =>
    normalizeStationName(station) === target
  );
}

function getWeekTag() {
  const day = new Date().getDay();

  if (day === 6) return { tag:'2', name:'토요일 기준' };
  if (day === 0) return { tag:'3', name:'휴일 기준' };

  return { tag:'1', name:'평일 기준' };
}

function timeToSeconds(time) {
  if (!time) return 0;

  const parts = String(time).split(':');
  let hours = parseInt(parts[0], 10) || 0;

  if (hours < 4) hours += 24;

  return hours * 3600
    + (parseInt(parts[1], 10) || 0) * 60
    + (parseInt(parts[2], 10) || 0);
}

function getTrainStatusText(status) {
  return ({
    '0':'진입',
    '1':'도착',
    '2':'출발',
    '3':'전역출발'
  })[String(status)] || '운행 중';
}

function setLoading(id, visible) {
  $(id).classList.toggle('hidden', !visible);
}


/* ========================================
   마지막 새로고침 시간
======================================== */

function updateRefreshLabel() {
  if (!lastRefreshTime) {
    $('lastRefresh').textContent = '새로고침 대기 중';
    return;
  }

  const seconds = Math.max(
    0,
    Math.floor((Date.now() - lastRefreshTime) / 1000)
  );

  if (seconds < 60) {
    $('lastRefresh').textContent = `${seconds}초 전`;
  } else if (seconds < 3600) {
    $('lastRefresh').textContent =
      `${Math.floor(seconds / 60)}분 전`;
  } else {
    $('lastRefresh').textContent =
      `${Math.floor(seconds / 3600)}시간 전`;
  }
}

function markRefreshed() {
  lastRefreshTime = Date.now();
  updateRefreshLabel();
}


/* ========================================
   노선 선택 버튼 생성
======================================== */

function renderLineButtons() {
  lineSelector.innerHTML = '';

  Object.entries(lineData).forEach(([name, data]) => {
    const button = document.createElement('button');

    button.type = 'button';
    button.className = 'line-button';
    button.textContent = name;
    button.dataset.line = name;
    button.style.setProperty('--button-color', data.color);

    button.addEventListener('click', () => {
      if (currentLine === name) return;

      fullPopup.classList.add('hidden');

      if (popupRefreshTimer) {
        clearInterval(popupRefreshTimer);
        popupRefreshTimer = null;
      }

      popupRequestId++;
      initMaps(name);

      button.scrollIntoView({
        behavior:'smooth',
        block:'nearest',
        inline:'center'
      });
    });

    lineSelector.appendChild(button);
  });

  updateActiveLineButton();
}

function updateActiveLineButton() {
  document.querySelectorAll('.line-button').forEach(button => {
    const active = button.dataset.line === currentLine;

    button.classList.toggle('active', active);

    if (active) {
      button.style.background = lineData[currentLine].color;
      button.style.borderColor = lineData[currentLine].color;
      button.style.color = '#fff';
    } else {
      button.style.background = '#f8fafc';
      button.style.borderColor = '#e2e8f0';
      button.style.color = '#475569';
    }
  });

  document.documentElement.style.setProperty(
    '--line-color',
    lineData[currentLine].color
  );
}


/* ========================================
   세로 지도 초기화
======================================== */

function initMaps(lineName) {
  if (refreshInterval) clearInterval(refreshInterval);

  mapRequestId++;
  currentLine = lineName;

  const line = lineData[currentLine];

  if (!line) return;

  updateActiveLineButton();

  vStationNodes.innerHTML = '';
  vTrainsContainer.innerHTML = '';

  const stations = line.stations;

  vMapContainer.style.height =
    `${Math.max(1, stations.length - 1) * V_SPACING + 60}px`;

  stations.forEach((station, index) => {
    const node = document.createElement('div');

    node.className = 'v-station-node';
    node.style.top = `${index * V_SPACING}px`;

    node.innerHTML =
      `<div class="v-station-name">${escapeHtml(station)}</div>`;

    node.addEventListener('click', () => {
      openFullPopup(station);
    });

    vStationNodes.appendChild(node);
  });

  refreshAll();

  refreshInterval = setInterval(() => {
    refreshAll();
  }, 10000);
}


/* ========================================
   전체 새로고침
======================================== */

async function refreshAll() {
  if (isRefreshing) return;

  isRefreshing = true;
  refreshButton.classList.add('loading');

  try {
    await fetchTrainPositions();

    if (!fullPopup.classList.contains('hidden') && currentStation) {
      const requestId = popupRequestId;

      await fetchStationDetails(
        currentStation,
        true,
        requestId
      );
    }

    markRefreshed();
  } finally {
    isRefreshing = false;
    refreshButton.classList.remove('loading');
  }
}

refreshButton.addEventListener('click', () => {
  refreshAll();
});


/* ========================================
   역 상세 팝업
======================================== */

function openFullPopup(station) {
  currentStation = station;

  popupRequestId++;
  const requestId = popupRequestId;

  fullPopup.classList.remove('hidden');

  pName.textContent = `${station}역`;
  pBadge.textContent = currentLine;

  [
    'arrLoading',
    'statLoading',
    'ttLoading'
  ].forEach(id => setLoading(id, true));

  timeRideNum.textContent = '-';
  timeAlightNum.textContent = '-';

  arrUpList.innerHTML = '';
  arrDownList.innerHTML = '';
  ttUpList.innerHTML = '';
  ttDownList.innerHTML = '';

  const stations = lineData[currentLine].stations;
  const centerIndex = getStationIndex(stations, station);

  currentPopupStations = [];

  if (centerIndex !== -1) {
    const start = Math.max(0, centerIndex - 3);
    const end = Math.min(stations.length - 1, centerIndex + 3);

    currentPopupStations = stations.slice(start, end + 1);

    hStationNodes.innerHTML = '';
    hTrainsContainer.innerHTML = '';

    hTrackWrapper.style.width =
      `${Math.max(1, currentPopupStations.length - 1) * H_SPACING + 60}px`;

    currentPopupStations.forEach((stn, index) => {
      const node = document.createElement('div');

      node.className = 'h-station-node';
      node.style.left = `${index * H_SPACING}px`;

      const isCurrent =
        normalizeStationName(stn) === normalizeStationName(station);

      node.innerHTML =
        `<div class="h-station-name"
          style="${isCurrent ? 'color:#fff;font-size:13px;top:-26px;' : ''}">
          ${escapeHtml(stn)}
        </div>`;

      hStationNodes.appendChild(node);
    });

    const scroll = $('hTrackScroll');
    const centerPosition = centerIndex - start;

    requestAnimationFrame(() => {
      scroll.scrollLeft = Math.max(
        0,
        centerPosition * H_SPACING - scroll.clientWidth / 2 + 30
      );
    });
  }

  if (popupRefreshTimer) {
    clearInterval(popupRefreshTimer);
  }

  fetchStationDetails(station, false, requestId);
  fetchTrainPositions();

  popupRefreshTimer = setInterval(() => {
    if (
      fullPopup.classList.contains('hidden') ||
      requestId !== popupRequestId
    ) {
      clearInterval(popupRefreshTimer);
      popupRefreshTimer = null;
      return;
    }

    fetchStationDetails(station, true, requestId);
    fetchTrainPositions();
  }, 10000);
}

closePopupBtn.addEventListener('click', () => {
  fullPopup.classList.add('hidden');

  popupRequestId++;

  if (popupRefreshTimer) {
    clearInterval(popupRefreshTimer);
    popupRefreshTimer = null;
  }
});


/* ========================================
   실시간 열차 위치
======================================== */

async function fetchTrainPositions() {
  const requestLine = currentLine;
  const requestId = mapRequestId;
  const line = lineData[requestLine];

  if (!line) return;

  try {
    const apiLine = line.apiName || requestLine;

    const url =
      `${BASE_SW}/${REALTIME_API_KEY}` +
      `/json/realtimePosition/0/100/` +
      `${encodeURIComponent(apiLine)}`;

    const response = await fetch(url, {
      cache:'no-store'
    });

    if (!response.ok) throw new Error('열차 위치 조회 실패');

    const data = await response.json();

    if (
      requestLine !== currentLine ||
      requestId !== mapRequestId
    ) return;

    if (data.errorMessage && data.errorMessage.code !== 'INFO-000') {
      throw new Error(data.errorMessage.message || 'API 오류');
    }

    const activeVertical = new Set();
    const activeHorizontal = new Set();

    const trains = Array.isArray(data.realtimePositionList)
      ? data.realtimePositionList
      : [];

    trains.forEach(train => {
      if (
        train.subwayId &&
        String(train.subwayId) !== String(line.id)
      ) return;

      const trainNo = String(train.trainNo || '').trim();

      if (!trainNo) return;

      const isUp = String(train.updnLine) === '0';
      const direction = isUp ? 1 : -1;
      const status = String(train.trainSttus ?? '');

      let offset = 0;

      if (status === '0' || status === '3') {
        offset = -35 * direction;
      } else if (status === '2') {
        offset = 35 * direction;
      }

      const domKey =
        `${line.id}-${train.updnLine}-${trainNo}`
          .replace(/[^a-zA-Z0-9_-]/g, '_');

      const statusText = escapeHtml(getTrainStatusText(status));

      /* 세로 지도 */
      const stationIndex = getStationIndex(
        line.stations,
        train.statnNm
      );

      if (stationIndex !== -1) {
        activeVertical.add(domKey);

        let element = document.getElementById(`v-train-${domKey}`);

        if (!element) {
          element = document.createElement('div');
          element.id = `v-train-${domKey}`;
          vTrainsContainer.appendChild(element);
        }

        element.className = `v-train ${isUp ? 'up' : 'down'}`;

        element.innerHTML =
          `<span>${escapeHtml(trainNo)}</span>` +
          `<div class="v-train-status">${statusText}</div>`;

        element.style.top =
          `${stationIndex * V_SPACING + offset}px`;
      }

      /* 팝업 가로 지도 */
      if (
        !fullPopup.classList.contains('hidden') &&
        currentPopupStations.length > 0
      ) {
        const horizontalIndex = getStationIndex(
          currentPopupStations,
          train.statnNm
        );

        if (horizontalIndex !== -1) {
          activeHorizontal.add(domKey);

          let element = document.getElementById(`h-train-${domKey}`);

          if (!element) {
            element = document.createElement('div');
            element.id = `h-train-${domKey}`;
            hTrainsContainer.appendChild(element);
          }

          element.className = `h-train ${isUp ? 'up' : 'down'}`;

          element.innerHTML =
            `<span>${escapeHtml(trainNo)}</span>` +
            `<div class="h-train-status">${statusText}</div>`;

          element.style.left =
            `${horizontalIndex * H_SPACING + offset}px`;
        }
      }
    });

    Array.from(vTrainsContainer.children).forEach(element => {
      const key = element.id.replace('v-train-', '');

      if (!activeVertical.has(key)) element.remove();
    });

    Array.from(hTrainsContainer.children).forEach(element => {
      const key = element.id.replace('h-train-', '');

      if (!activeHorizontal.has(key)) element.remove();
    });

  } catch (error) {
    console.error('실시간 열차 위치 오류:', error);
  }
}


/* ========================================
   실시간 도착 정보
======================================== */

async function fetchArrivalInfo(station, requestId) {
  try {
    const stationName = normalizeStationName(station);

    const url =
      `${BASE_SW}/${REALTIME_API_KEY}` +
      `/json/realtimeStationArrival/0/30/` +
      `${encodeURIComponent(stationName)}`;

    const response = await fetch(url, {
      cache:'no-store'
    });

    if (!response.ok) throw new Error('도착 정보 조회 실패');

    const data = await response.json();

    if (requestId !== popupRequestId) return;

    const all = Array.isArray(data.realtimeArrivalList)
      ? data.realtimeArrivalList
      : [];

    const targetId = String(lineData[currentLine].id);

    let trains = all.filter(train =>
      String(train.subwayId || '') === targetId
    );

    if (trains.length === 0) {
      trains = all;
    }

    trains.sort((a, b) => {
      const getWeight = train => {
        const message = String(train.arvlMsg2 || '');

        if (message.includes('도착')) return 0;
        if (message.includes('진입')) return 1;

        const seconds = parseInt(train.barvlDt, 10);

        if (Number.isFinite(seconds) && seconds > 0) {
          return 10 + seconds;
        }

        return 5000;
      };

      return getWeight(a) - getWeight(b);
    });

    let upHTML = '';
    let downHTML = '';

    trains.forEach(train => {
      const directionText = String(train.updnLine || '');

      const isUp =
        directionText === '상행' ||
        directionText === '내선' ||
        directionText === '0';

      const rawMessage = String(train.arvlMsg2 || '운행 중');

      let timeText = rawMessage;

      const seconds = parseInt(train.barvlDt, 10);

      if (Number.isFinite(seconds) && seconds > 0) {
        const minutes = Math.floor(seconds / 60);
        const remainder = seconds % 60;

        timeText = minutes > 0
          ? `약 ${minutes}분 ${remainder}초 후`
          : `약 ${seconds}초 후`;
      }

      let status = '운행 중';

      if (rawMessage.includes('진입')) status = '진입';
      else if (rawMessage.includes('도착')) status = '도착';
      else if (rawMessage.includes('출발')) status = '출발';

      const badgeText =
        String(train.btrainSttus || '').includes('급행')
          ? '급행'
          : String(train.btrainSttus || '').includes('특급')
            ? '특급'
            : '일반';

      const badgeClass =
        badgeText === '급행'
          ? 'exp-express'
          : badgeText === '특급'
            ? 'exp-special'
            : '';

      const html = `
        <div class="arr-item ${isUp ? 'up' : 'down'}">
          <div class="arr-top-row">
            <span class="arr-time">${escapeHtml(timeText)}</span>
            <span class="exp-badge ${badgeClass}">${badgeText}</span>
          </div>
          <div class="arr-desc">
            ${escapeHtml(train.bstatnNm || train.statnTnm || '방면')}행
            <br>
            현재: ${escapeHtml(train.arvlMsg3 || train.statnNm || '운행 중')}
            (${escapeHtml(status)})
          </div>
        </div>
      `;

      if (isUp) upHTML += html;
      else downHTML += html;
    });

    arrUpList.innerHTML =
      upHTML ||
      '<div class="arr-item">도착 정보 없음</div>';

    arrDownList.innerHTML =
      downHTML ||
      '<div class="arr-item">도착 정보 없음</div>';

  } catch (error) {
    if (requestId === popupRequestId) {
      arrUpList.innerHTML =
        '<div class="arr-item">데이터 없음</div>';

      arrDownList.innerHTML =
        '<div class="arr-item">데이터 없음</div>';
    }
  } finally {
    if (requestId === popupRequestId) {
      setLoading('arrLoading', false);
    }
  }
}


/* ========================================
   승하차 통계
======================================== */

async function fetchStatistics(station, requestId) {
  try {
    const date = new Date();

    date.setDate(date.getDate() - 3);

    const dateString =
      `${date.getFullYear()}` +
      `${String(date.getMonth() + 1).padStart(2, '0')}` +
      `${String(date.getDate()).padStart(2, '0')}`;

    const url =
      `${BASE_OPEN}/${OPEN_API_KEY}` +
      `/json/CardSubwayStatsNew/1/1000/${dateString}`;

    const response = await fetch(url, {
      cache:'no-store'
    });

    if (!response.ok) throw new Error('통계 조회 실패');

    const data = await response.json();

    if (requestId !== popupRequestId) return;

    const rows = data.CardSubwayStatsNew?.row || [];

    const target = normalizeStationName(station);

    const match = rows.find(row =>
      normalizeStationName(row.SUB_STA_NM) === target
    );

    if (!match) throw new Error('통계 없음');

    timeRideNum.textContent =
      `${Number(match.RIDE_PASGR_NUM).toLocaleString()}명`;

    timeAlightNum.textContent =
      `${Number(match.ALIGHT_PASGR_NUM).toLocaleString()}명`;

  } catch (error) {
    if (requestId === popupRequestId) {
      timeRideNum.textContent = '데이터 없음';
      timeAlightNum.textContent = '데이터 없음';
    }
  } finally {
    if (requestId === popupRequestId) {
      setLoading('statLoading', false);
    }
  }
}


/* ========================================
   시간표 조회
======================================== */

async function fetchTimetable(station, requestId) {
  const week = getWeekTag();

  ttDateType.textContent = week.name;

  try {
    const stationName = normalizeStationName(station);

    const searchURL =
      `${BASE_OPEN}/${OPEN_API_KEY}` +
      `/json/SearchInfoBySubwayNameService/1/50/` +
      `${encodeURIComponent(stationName)}`;

    const searchResponse = await fetch(searchURL, {
      cache:'no-store'
    });

    if (!searchResponse.ok) throw new Error('역 조회 실패');

    const searchData = await searchResponse.json();

    const rows =
      searchData.SearchInfoBySubwayNameService?.row || [];

    const lineName = currentLine;

    const match = rows.find(row => {
      const value = String(row.LINE_NUM || '');

      if (lineName === 'GTX-A') {
        return value.includes('GTX');
      }

      if (lineName === '경의중앙선') {
        return value.includes('경의') || value.includes('중앙');
      }

      const number = lineName.match(/\d+/)?.[0];

      return number ? value.includes(number) : false;
    });

    if (!match) {
      throw new Error('노선별 역 코드 없음');
    }

    const stationCode = match.STATION_CD;

    const upURL =
      `${BASE_OPEN}/${OPEN_API_KEY}` +
      `/json/SearchSTTimeTableByIDService/1/500/` +
      `${stationCode}/${week.tag}/1/`;

    const downURL =
      `${BASE_OPEN}/${OPEN_API_KEY}` +
      `/json/SearchSTTimeTableByIDService/1/500/` +
      `${stationCode}/${week.tag}/2/`;

    const [upResponse, downResponse] = await Promise.all([
      fetch(upURL, {cache:'no-store'}),
      fetch(downURL, {cache:'no-store'})
    ]);

    if (!upResponse.ok || !downResponse.ok) {
      throw new Error('시간표 조회 실패');
    }

    const [upData, downData] = await Promise.all([
      upResponse.json(),
      downResponse.json()
    ]);

    if (requestId !== popupRequestId) return;

    const upRows =
      upData.SearchSTTimeTableByIDService?.row || [];

    const downRows =
      downData.SearchSTTimeTableByIDService?.row || [];

    ttUpList.innerHTML = renderTimetable(upRows, true);
    ttDownList.innerHTML = renderTimetable(downRows, false);

  } catch (error) {
    if (requestId === popupRequestId) {
      ttUpList.innerHTML =
        '<div class="tt-item">시간표 데이터 없음</div>';

      ttDownList.innerHTML =
        '<div class="tt-item">시간표 데이터 없음</div>';
    }
  } finally {
    if (requestId === popupRequestId) {
      setLoading('ttLoading', false);
    }
  }
}

function renderTimetable(rows, isUp) {
  if (!rows.length) {
    return '<div class="tt-item">시간표 데이터 없음</div>';
  }

  const now = new Date();

  let hour = now.getHours();

  if (hour < 4) hour += 24;

  const currentSeconds =
    hour * 3600 +
    now.getMinutes() * 60 +
    now.getSeconds();

  function getTime(row) {
    if (row.ARRIVETIME && row.ARRIVETIME !== '00:00:00') {
      return row.ARRIVETIME;
    }

    if (row.LEFTTIME && row.LEFTTIME !== '00:00:00') {
      return row.LEFTTIME;
    }

    return '';
  }

  const valid = rows
    .filter(row => {
      const time = getTime(row);

      return time && timeToSeconds(time) >= currentSeconds;
    })
    .sort((a, b) =>
      timeToSeconds(getTime(a)) - timeToSeconds(getTime(b))
    )
    .slice(0, 10);

  if (!valid.length) {
    return '<div class="tt-item">금일 운행 종료</div>';
  }

  return valid.map(row => {
    const time = getTime(row).substring(0, 5);

    const express =
      ['G','D','E'].includes(String(row.EXPRESS_YN)) ||
      String(row.FL_FLAG || '').includes('급행');

    const special =
      row.EXPRESS_YN === 'S' ||
      String(row.FL_FLAG || '').includes('특급');

    const badge = express
      ? '급행'
      : special
        ? '특급'
        : '일반';

    const badgeClass = express
      ? 'exp-express'
      : special
        ? 'exp-special'
        : '';

    return `
      <div class="tt-item ${isUp ? 'up' : 'down'}">
        <div class="arr-top-row">
          <strong>${escapeHtml(time)}</strong>
          <span class="exp-badge ${badgeClass}">${badge}</span>
        </div>
        <div class="arr-desc">
          ${escapeHtml(
            row.SUBWAYENAME ||
            row.SUBWAYSNAME ||
            row.DESTSTATION ||
            '방면'
          )}행
        </div>
      </div>
    `;
  }).join('');
}


/* ========================================
   통합 상세 정보 조회
======================================== */

function fetchStationDetails(
  station,
  isSilent = false,
  requestId = popupRequestId
) {
  if (!isSilent) {
    [
      'arrLoading',
      'statLoading',
      'ttLoading'
    ].forEach(id => setLoading(id, true));
  }

  fetchArrivalInfo(station, requestId);
  fetchStatistics(station, requestId);
  fetchTimetable(station, requestId);
}

elapsedTimer = setInterval(updateRefreshLabel, 1000);
