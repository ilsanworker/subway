<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subway Radar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Subway Radar</h1>
      <p>서울 실시간 지하철 위치정보</p>
    </header>

    <div class="controls-card">
      <div class="input-row">
        <div class="input-group">
          <label for="apiKey">API 인증키</label>
          <input type="text" id="apiKey" placeholder="발급받은 API 키 입력" value="sample">
        </div>
        <div class="input-group">
          <label for="lineSelect">노선 선택</label>
          <select id="lineSelect">
            <option value="1호선">1호선</option>
            <option value="2호선" selected>2호선</option>
            <option value="3호선">3호선</option>
            <option value="4호선">4호선</option>
            <option value="5호선">5호선</option>
            <option value="6호선">6호선</option>
            <option value="7호선">7호선</option>
            <option value="8호선">8호선</option>
            <option value="9호선">9호선</option>
          </select>
        </div>
      </div>
      <button id="fetchBtn" class="btn-primary">실시간 위치 조회</button>
    </div>

    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <p>실시간 데이터를 불러오는 중입니다...</p>
    </div>
    
    <div id="resultGrid" class="result-grid"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
