<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seoul Subway All-Lines Live Radar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    
    <!-- 상단 컨트롤바 -->
    <header class="topbar">
      <div class="logo">🚇 서울 지하철 통합 실시간 관제</div>
      <div class="controls">
        <input type="text" id="apiKey" placeholder="API 키 (기본: sample)" value="sample">
        <select id="lineSelect">
          <option value="1호선">1호선</option>
          <option value="2호선" selected>2호선 (순환)</option>
          <option value="3호선">3호선</option>
          <option value="4호선">4호선</option>
          <option value="5호선">5호선</option>
          <option value="6호선">6호선</option>
          <option value="7호선">7호선</option>
          <option value="8호선">8호선</option>
          <option value="9호선">9호선</option>
        </select>
        <div class="live-indicator">
          <div class="pulse-dot"></div> Live
        </div>
      </div>
    </header>

    <!-- 메인 지도 영역 -->
    <main class="map-area">
      <div class="map-instruction">상단에서 노선을 변경하고, 역을 클릭하여 상세 도착 및 통계 정보를 확인하세요.</div>
      
      <!-- 가로 스크롤 노선도 컨테이너 -->
      <div class="track-scroll-container">
        <div class="track-wrapper" id="trackWrapper">
          <div class="track-line up-line"></div>
          <div class="track-line down-line"></div>
          
          <!-- 역 노드들이 생성되는 곳 -->
          <div id="stationNodes" class="station-nodes"></div>
          
          <!-- 실시간 열차 아이콘들이 생성되는 곳 -->
          <div id="trainsContainer" class="trains-container"></div>
        </div>
      </div>
    </main>

    <!-- 우측 상세정보 패널 -->
    <aside class="detail-panel" id="detailPanel">
      <button class="close-btn" id="closePanel">×</button>
      
      <div class="panel-header">
        <span class="badge" id="panelLineBadge">2호선</span>
        <h2 id="panelStationName">역을 선택하세요</h2>
        <p id="panelStationEng" class="eng-name">Select a station</p>
      </div>

      <div class="panel-content" id="panelContent">
        <div class="info-section">
          <h3>📊 실시간 통계 & 환승 정보</h3>
          <div id="statLoading" class="loading-text hidden">데이터 로딩중...</div>
          <div class="stat-grid">
            <div class="stat-box">
              <div class="stat-title">환승 가능 노선</div>
              <div class="stat-value" id="transferLines">-</div>
            </div>
            <div class="stat-box">
              <div class="stat-title">일평균 승차</div>
              <div class="stat-value" id="rideNum">-</div>
            </div>
            <div class="stat-box">
              <div class="stat-title">일평균 하차</div>
              <div class="stat-value" id="alightNum">-</div>
            </div>
          </div>
        </div>

        <div class="info-section">
          <h3>⏱️ 실시간 도착 정보</h3>
          <div id="arrLoading" class="loading-text hidden">데이터 로딩중...</div>
          <div class="arrival-split">
            <div class="arr-col">
              <h4>상행 / 내선</h4>
              <div id="arrUpList" class="arr-list">대기 열차 없음</div>
            </div>
            <div class="arr-col">
              <h4>하행 / 외선</h4>
              <div id="arrDownList" class="arr-list">대기 열차 없음</div>
            </div>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
