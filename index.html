<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seoul Subway Command Center</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- 좌측 사이드바 (검색 및 설정) -->
    <aside class="sidebar">
      <div class="logo-area">
        <h1>🚇 SubRadar</h1>
        <p>서울 지하철 통합 관제</p>
      </div>

      <div class="control-panel">
        <div class="input-group">
          <label for="apiKey">API 인증키 (통합)</label>
          <input type="text" id="apiKey" placeholder="sample 또는 발급키" value="sample">
        </div>
        
        <div class="input-group search-group">
          <label for="stationInput">역명 검색 (예: 강남, 서울)</label>
          <div class="search-box">
            <input type="text" id="stationInput" placeholder="역 이름 입력..." value="강남">
            <button id="searchBtn">검색</button>
          </div>
        </div>
        
        <div class="input-group">
          <label for="lineSelect">노선 선택 (위치조회용)</label>
          <select id="lineSelect">
            <option value="1호선">1호선</option>
            <option value="2호선" selected>2호선</option>
            <option value="3호선">3호선</option>
            <option value="4호선">4호선</option>
            <option value="5호선">5호선</option>
            <option value="6호선">6호선</option>
            <option value="7호선">7호선</option>
            <option value="8호선">8호선</option>
            <option value="9호선">9호선</option>
          </select>
        </div>
      </div>
      
      <div class="status-indicator">
        <div class="status-dot green"></div> API Connection Ready
      </div>
    </aside>

    <!-- 우측 메인 대시보드 -->
    <main class="dashboard">
      <!-- 1. 역 기본 정보 (OA-15799) -->
      <section class="card widget-info">
        <h2 class="card-title">역 기본 정보</h2>
        <div id="infoContent" class="widget-content">
          <p class="placeholder-text">역을 검색하면 정보가 표시됩니다.</p>
        </div>
      </section>

      <!-- 2. 실시간 도착 정보 (OA-12764) -->
      <section class="card widget-arrival">
        <h2 class="card-title">실시간 도착 타임라인</h2>
        <div id="arrivalContent" class="widget-content arrival-grid">
          <div class="direction-col" id="arrivalUp">
            <h3>상행 / 내선</h3>
            <div class="list"></div>
          </div>
          <div class="direction-col" id="arrivalDown">
            <h3>하행 / 외선</h3>
            <div class="list"></div>
          </div>
        </div>
      </section>

      <!-- 3. 실시간 위치 정보 (OA-12601) -->
      <section class="card widget-position">
        <h2 class="card-title">노선 실시간 열차 위치 <span id="currentLineBadge" class="badge">2호선</span></h2>
        <div id="positionContent" class="widget-content position-scroll">
          <p class="placeholder-text">데이터를 불러오는 중입니다...</p>
        </div>
      </section>

      <!-- 4. 승하차 통계 (DT201004I040014) -->
      <section class="card widget-stats">
        <h2 class="card-title">일평균 승하차 통계 (최근 데이터)</h2>
        <div id="statsContent" class="widget-content">
          <p class="placeholder-text">데이터를 불러오는 중입니다...</p>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
