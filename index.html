<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지하철 실시간 위치 조회</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f3f4f6; }
        .progress-bar-stripes {
            background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.15) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.15) 50%, rgba(255, 255, 255, 0.15) 75%, transparent 75%, transparent);
            background-size: 1rem 1rem;
            animation: progress-animation 1s linear infinite;
        }
        @keyframes progress-animation {
            from { background-position: 1rem 0; }
            to { background-position: 0 0; }
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto bg-white p-6 md:p-10 rounded-2xl shadow-lg">
        <h1 class="text-2xl md:text-3xl font-bold text-center mb-8 text-blue-600">
            🚇 지하철 실시간 열차 위치 조회
        </h1>
        
        <div class="flex flex-col md:flex-row gap-4 mb-6">
            <input type="text" id="apiKey" placeholder="API 키 입력 (인증키)" class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
            
            <select id="lineName" class="px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
                <option value="1호선">1호선</option>
                <option value="2호선">2호선</option>
                <option value="3호선">3호선</option>
                <option value="4호선">4호선</option>
                <option value="5호선">5호선</option>
                <option value="6호선">6호선</option>
                <option value="7호선">7호선</option>
                <option value="8호선">8호선</option>
                <option value="9호선">9호선</option>
                <option value="수인분당선">수인분당선</option>
                <option value="경의중앙선">경의중앙선</option>
                <option value="신분당선">신분당선</option>
            </select>
            
            <button onclick="fetchData()" id="searchBtn" class="px-8 py-3 bg-blue-500 text-white font-bold rounded-lg hover:bg-blue-600 transition duration-200 shadow-md">
                조회하기
            </button>
        </div>

        <div id="progressContainer" class="hidden w-full bg-gray-200 rounded-full h-4 mb-6 relative overflow-hidden">
            <div id="progressBar" class="bg-blue-600 h-4 rounded-full progress-bar-stripes transition-all duration-300 ease-out" style="width: 0%"></div>
            <div id="progressText" class="absolute inset-0 flex justify-center items-center text-[10px] font-bold text-white shadow-sm drop-shadow-md">0%</div>
        </div>

        <div id="errorBox" class="hidden bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded-r-lg" role="alert">
            <p class="font-bold">오류 발생!</p>
            <p id="errorText" class="text-sm mt-1"></p>
        </div>
        
        <div class="overflow-x-auto rounded-lg border border-gray-200">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b border-gray-200 text-gray-700">
                        <th class="p-4 whitespace-nowrap">열차번호</th>
                        <th class="p-4 whitespace-nowrap">행선지</th>
                        <th class="p-4 whitespace-nowrap">방향</th>
                        <th class="p-4 whitespace-nowrap">현재 위치</th>
                        <th class="p-4 whitespace-nowrap">상태</th>
                        <th class="p-4 whitespace-nowrap">특이사항</th>
                    </tr>
                </thead>
                <tbody id="resultBody" class="text-gray-600">
                    <tr>
                        <td colspan="6" class="p-8 text-center text-gray-400">API 키를 입력하고 조회 버튼을 눌러주세요.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function simulateProgress(duration) {
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            let progress = 0;
            const interval = 50;
            const step = (100 / (duration / interval));

            return new Promise(resolve => {
                const timer = setInterval(() => {
                    progress += step;
                    if (progress >= 90) {
                        clearInterval(timer);
                        resolve();
                    } else {
                        progressBar.style.width = `${progress}%`;
                        progressText.textContent = `${Math.floor(progress)}%`;
                    }
                }, interval);
            });
        }

        function completeProgress() {
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            progressBar.style.width = '100%';
            progressText.textContent = '100%';
            
            setTimeout(() => {
                document.getElementById('progressContainer').classList.add('hidden');
            }, 500);
        }

        // 403 방지를 위한 다중 프록시 호출 함수 (순차적 우회)
        async function fetchWithProxyFallback(targetUrl) {
            const proxies = [
                url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
                url => `https://thingproxy.freeboard.io/fetch/${encodeURIComponent(url)}`
            ];

            let lastError = null;

            for (let i = 0; i < proxies.length; i++) {
                try {
                    const proxyUrl = proxies[i](targetUrl);
                    const response = await fetch(proxyUrl);
                    
                    if (response.ok) {
                        const text = await response.text();
                        // 반환된 데이터가 JSON 형식인지 검증
                        const data = JSON.parse(text);
                        return data;
                    }
                } catch (err) {
                    lastError = err;
                    console.warn(`프록시 ${i + 1}번 실패, 다음 우회 서버 시도 중...`);
                }
            }

            throw new Error(lastError ? lastError.message : '모든 우회 서버 통신에 실패했습니다.');
        }

        async function fetchData() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const lineName = document.getElementById('lineName').value;
            const searchBtn = document.getElementById('searchBtn');
            const progressContainer = document.getElementById('progressContainer');
            const errorBox = document.getElementById('errorBox');
            const errorText = document.getElementById('errorText');
            const resultBody = document.getElementById('resultBody');

            errorBox.classList.add('hidden');
            resultBody.innerHTML = '';
            
            if (!apiKey) {
                errorText.textContent = 'API 키가 비어있습니다. 발급받으신 인증키를 정확히 입력해주세요.';
                errorBox.classList.remove('hidden');
                return;
            }

            searchBtn.disabled = true;
            searchBtn.classList.add('opacity-50', 'cursor-not-allowed');
            searchBtn.textContent = '조회 중...';
            
            progressContainer.classList.remove('hidden');
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('progressText').textContent = '0%';

            const progressPromise = simulateProgress(1500);

            try {
                const apiUrl = `http://swopenapi.seoul.go.kr/api/subway/${apiKey}/json/realtimePosition/0/100/${encodeURIComponent(lineName)}`;
                
                // 다중 프록시 우회 호출
                const data = await fetchWithProxyFallback(apiUrl);
                await progressPromise; 

                if (data.RESULT && data.RESULT.CODE !== 'INFO-000') {
                    let errorMsg = `[API 오류: ${data.RESULT.CODE}] ${data.RESULT.MESSAGE}`;
                    if (data.RESULT.CODE === 'ERROR-333') errorMsg = '해당 호선의 운행 데이터가 현재 없습니다. (막차 시간 이후 등)';
                    else if (data.RESULT.CODE === 'INFO-200') errorMsg = '해당 데이터가 없습니다. (정상적인 응답이나 빈 데이터)';
                    else if (data.RESULT.CODE === 'ERROR-336') errorMsg = '데이터 요청 횟수를 초과했습니다. 일일 제한량을 확인하세요.';
                    else if (data.RESULT.CODE === 'ERROR-331' || data.RESULT.CODE === 'ERROR-332') errorMsg = '유효하지 않은 API 키(인증키)입니다. 키 값을 다시 확인해주세요.';
                    
                    throw new Error(errorMsg);
                }

                if (!data.realtimePosition || !data.realtimePosition.row) {
                    throw new Error('데이터 형식이 올바르지 않거나 현재 운행 중인 열차가 없습니다.');
                }

                renderTable(data.realtimePosition.row);
                completeProgress();

            } catch (err) {
                await progressPromise;
                completeProgress(); 
                
                let errorMessage = err.message;
                if (errorMessage.includes('Failed to fetch') || errorMessage.includes('Unexpected token')) {
                    errorMessage = '네트워크 응답 형식이 올바르지 않거나 인증키가 유효하지 않습니다. API 키 값을 다시 한번 확인해 주세요.';
                }

                errorText.innerHTML = `데이터를 가져오는 중 문제가 발생했습니다.<br><span class="text-red-900 font-semibold">${errorMessage}</span>`;
                errorBox.classList.remove('hidden');
                resultBody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-400">데이터 조회 실패</td></tr>`;
            } finally {
                searchBtn.disabled = false;
                searchBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                searchBtn.textContent = '조회하기';
            }
        }

        function renderTable(rows) {
            const resultBody = document.getElementById('resultBody');
            resultBody.innerHTML = '';
            
            const getStatus = (code) => {
                switch(code) {
                    case '0': return '<span class="px-2 py-1 bg-blue-100 text-blue-700 rounded-md text-sm font-bold">진입</span>';
                    case '1': return '<span class="px-2 py-1 bg-green-100 text-green-700 rounded-md text-sm font-bold">도착</span>';
                    case '2': return '<span class="px-2 py-1 bg-orange-100 text-orange-700 rounded-md text-sm font-bold">출발</span>';
                    case '3': return '<span class="px-2 py-1 bg-gray-100 text-gray-700 rounded-md text-sm font-bold">전역출발</span>';
                    default: return code;
                }
            };

            const getDirection = (code) => code === '0' ? '상행/내선' : '하행/외선';

            const getSpecialStatus = (directCode, lastCarCode) => {
                let badges = '';
                if (directCode === '1') badges += '<span class="px-2 py-1 bg-red-500 text-white rounded-md text-xs font-bold mr-1">급행</span>';
                if (directCode === '7') badges += '<span class="px-2 py-1 bg-purple-500 text-white rounded-md text-xs font-bold mr-1">특급</span>';
                if (lastCarCode === '1') badges += '<span class="px-2 py-1 bg-gray-800 text-white rounded-md text-xs font-bold mr-1">막차</span>';
                return badges === '' ? '<span class="text-gray-400 text-sm">-</span>' : badges;
            };

            if (rows.length === 0) {
                 resultBody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-500">현재 운행 중인 열차 정보가 없습니다.</td></tr>`;
                 return;
            }

            rows.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = 'border-b border-gray-100 hover:bg-gray-50 transition duration-150';
                
                tr.innerHTML = `
                    <td class="p-4 font-mono text-gray-600">${row.trainNo}</td>
                    <td class="p-4 font-semibold text-gray-800">${row.statnTnm}행</td>
                    <td class="p-4 text-gray-600">${getDirection(row.updnLine)}</td>
                    <td class="p-4 font-bold text-blue-700">${row.statnNm}</td>
                    <td class="p-4">${getStatus(row.trainSttus)}</td>
                    <td class="p-4">${getSpecialStatus(row.directAt, row.lstcarAt)}</td>
                `;
                resultBody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
